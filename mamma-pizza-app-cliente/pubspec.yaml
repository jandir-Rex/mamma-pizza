name: mamma_pizza_cliente
description: App de clientes pedidos.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  google_fonts: ^8.2.1
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/icon/Logotipo Mamma Pizza.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true